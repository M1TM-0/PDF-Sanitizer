# One service: a fully network-isolated, one-shot local/batch job. This is
# the only deployment mode in this project -- there is no HTTP server, so
# there is no tension around needing inbound network access, and
# `network_mode: none` applies unconditionally. See README.md "Docker".
#
#   docker compose build
#   docker compose run --rm \
#     -v "$(pwd)/untrusted:/data/input:ro" \
#     -v "$(pwd)/sanitized:/data/output" \
#     sanitize-once sanitize /data/input/untrusted.pdf -o /data/output/sanitized.pdf
#
# Or use the `./sanitize` wrapper script at the repo root, which builds
# this same `docker compose run` invocation for you.
#
# Requires Docker Compose v2 (the `docker compose` subcommand, not the
# standalone `docker-compose` v1 binary) for `cpus:`/`pids_limit:` at the
# top level of a service to take effect without a `deploy:` block.
#
# CONFIGURATION -- single source of truth, no rebuild required
# ==============================================================
# Every ${VAR:-default} below reads from the ".env" file in this same
# directory (Compose auto-loads it) -- the exact file `./sanitize config`
# / `pdf-sanitizer config` read and write. Its absence is not an error:
# every fallback default here is identical to that setting's built-in
# default in pdf_sanitizer/config.py, so a fresh checkout with no ".env"
# yet already behaves exactly like the recommended configuration. Never
# hand-edit limits into this file -- change them with:
#
#   ./sanitize config set --max-pages 1000 --max-input-size 500M \
#     --max-output-size 3G --memory 4G --timeout 600 --dpi 150 \
#     --format jpeg --jpeg-quality 90
#
# and re-run `docker compose run` (or `./sanitize <file.pdf>`); no
# `docker compose build` needed unless code/dependencies changed.

services:
  sanitize-once:
    build: .
    image: pdf-sanitizer:latest
    network_mode: none
    init: true # reaps zombie processes correctly; important since this app spawns subprocesses
    read_only: true
    tmpfs:
      # Backs the isolated per-job temp dir (rendered page images before
      # reconstruction). Independent of PDF_SANITIZER_MAX_INPUT_BYTES --
      # the on-disk footprint here is driven by page count/DPI, not by
      # the raw size of the input file. Raise this (`./sanitize config
      # set --tmpfs 4G`) if you routinely process very high page-count or
      # very high-DPI documents.
      - /tmp/pdf_sanitizer:size=${PDF_SANITIZER_TMPFS_SIZE:-2147483648},uid=10001,gid=10001,mode=1700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The same "memory" budget the app itself uses (see
    # pdf_sanitizer.security.worker_rlimit_bytes): this is the outer,
    # kernel-enforced cgroup limit, deliberately a bit above the worker's
    # own in-process RLIMIT_AS so a well-behaved rejection (OutOfMemoryError)
    # is what a malicious/pathological PDF normally hits, with this cgroup
    # limit as the hard backstop if it doesn't.
    mem_limit: ${PDF_SANITIZER_MAX_MEMORY_BYTES:-2147483648}
    memswap_limit: ${PDF_SANITIZER_MAX_MEMORY_BYTES:-2147483648}
    cpus: 1.0
    pids_limit: 128
    environment:
      PDF_SANITIZER_MAX_INPUT_BYTES: ${PDF_SANITIZER_MAX_INPUT_BYTES:-524288000} # 500 MiB
      PDF_SANITIZER_MAX_OUTPUT_BYTES: ${PDF_SANITIZER_MAX_OUTPUT_BYTES:-3221225472} # 3 GiB
      PDF_SANITIZER_MAX_MEMORY_BYTES: ${PDF_SANITIZER_MAX_MEMORY_BYTES:-2147483648} # 2 GiB
      PDF_SANITIZER_MAX_PAGES: ${PDF_SANITIZER_MAX_PAGES:-300}
      PDF_SANITIZER_PROCESSING_TIMEOUT_SECONDS: ${PDF_SANITIZER_PROCESSING_TIMEOUT_SECONDS:-600}
      PDF_SANITIZER_RENDER_DPI: ${PDF_SANITIZER_RENDER_DPI:-150}
      PDF_SANITIZER_OUTPUT_IMAGE_FORMAT: ${PDF_SANITIZER_OUTPUT_IMAGE_FORMAT:-jpeg}
      PDF_SANITIZER_JPEG_QUALITY: ${PDF_SANITIZER_JPEG_QUALITY:-90}
